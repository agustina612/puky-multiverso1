<body onload="iniciarApp()">

    <div class="cherry-container" id="petals"></div>

    <div id="splash-screen">
        <h1>¡Bienvenidos al Mundo Puky! 🌸✨🐾</h1>
    </div>

    <div class="intro-card">
        <p>"Somos Puky, una regalaría para que tú puedas dar amor de la forma más bonita que existe."</p>
    </div>

    <div class="main-container">
        <aside class="profile-sidebar">
            <img src="puky.png" class="profile-pic" alt="Puky Logo">
            <h2 style="font-family: 'Fredoka One'; color: var(--pink-bright); margin: 5px 0;">Puky Shop 🐾</h2>
            <p style="font-size: 0.85rem; color: #666;">Córdoba, AR 🇦🇷<br>Detalles que emocionan.</p>
        </aside>

        <main class="shop-panel">
            <div id="home" class="section active">
                <h2 style="font-family: 'Fredoka One'; color: var(--pink-bright);">Elige una categoría 🌸</h2>
                <div class="worlds-grid">
                    <div class="card" onclick="mostrarProductos('flores')"><img src="img/regaleria/flores/rosasde7/flor1.jpg"><span>Flores 🌸</span></div>
                    <div class="card" onclick="mostrarProductos('peluches')"><img src="img/regaleria/peluches/peluche1kuromy.jpg"><span>Peluches 🧸</span></div>
                    <div class="card" onclick="mostrarProductos('cajas')"><img src="img/regaleria/cajas/caja1.jpg"><span>Cajas 🎁</span></div>
                </div>
            </div>

            <div id="pantalla-productos" class="section">
                <button class="pill-button" onclick="volver('home')">← Volver</button>
                <h2 id="titulo-categoria" style="font-family: 'Fredoka One'; color: var(--pink-bright); text-align: center;"></h2>
                <div class="worlds-grid" id="grid-productos"></div>
            </div>

            <div id="configurador" class="section">
                <button class="pill-button" onclick="volver('pantalla-productos')">← Atrás</button>
                <div style="display: flex; flex-wrap: wrap; gap: 20px; margin-top: 10px;">
                    <img id="final-img" style="width: 220px; height: 220px; object-fit: cover; border-radius: 20px; border: 4px solid white; box-shadow: 0 5px 15px rgba(0,0,0,0.1);">
                    <div style="flex: 1; min-width: 250px;">
                        <h2 id="final-titulo" style="font-family: 'Fredoka One'; color: var(--pink-bright); margin-top: 0;"></h2>
                        
                        <div id="seccion-color">
                            <label><b>Color disponible:</b> <span id="txt-color">Rosa</span></label>
                            <div class="color-picker" id="picker-colores"></div>
                        </div>

                        <div id="seccion-cantidad">
                            <label><b>Selecciona la cantidad:</b></label>
                            <div class="quantity-selector" id="contenedor-botones-cant"></div>
                        </div>
                        
                        <textarea id="nota" placeholder="¿Algún mensaje para la tarjeta?"></textarea>
                        
                        <div class="total-box" id="display-total">$0</div>
                        <button class="pill-button" style="width: 100%; font-size: 1.1rem;" onclick="mandarPedido()">Pedir por WhatsApp 📱</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        function iniciarApp() {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.style.opacity = '0';
                setTimeout(() => splash.style.visibility = 'hidden', 1000);
            }, 2500);
            generarPetalos();
        }

        function generarPetalos() {
            const container = document.getElementById('petals');
            for(let i=0; i<25; i++) {
                let p = document.createElement('div');
                p.className = 'petal';
                p.style.width = Math.random() * 15 + 10 + 'px';
                p.style.height = p.style.width;
                p.style.left = Math.random() * 100 + 'vw';
                p.style.animationDuration = Math.random() * 3 + 5 + 's';
                p.style.animationDelay = Math.random() * 5 + 's';
                container.appendChild(p);
            }
        }

        const db = {
            flores: { 
                items: [
                    { 
                        n: "RosaEterna", 
                        isRosas: true,
                        preciosPorCantidad: { 1: 1800, 7: 12000, 12: 20000, 20: 32000, 25: 39000, 30: 45000, 35: 50000 },
                        cantidades: [1, 7, 12, 20, 25, 30, 35],
                        folders: {
                            1: "individuales",
                            7: "rosasde7",
                            12: "rosasde12",
                            20: "rosasde20",
                            25: "rosasde25",
                            30: "rosasde30",
                            35: "rosasde35"
                        },
                        images: ["flor1.jpg", "flor2rosas.jpg", "ramolopso.jpg", "rosasflor3.jpg"]
                    },
                    { 
                        n: "Crisantemos", 
                        folder: "crisantemos", 
                        pUnidad: 1800, 
                        cantidades: [1, 7, 12],
                        images: ["flor1.jpg", "flor2rosas.jpg", "ramolopso.jpg", "rosasflor3.jpg"]
                    },
                    { 
                        n: "Jazmín", 
                        folder: "jasmin", 
                        pUnidad: 1800, 
                        cantidades: [1, 7, 12],
                        images: ["flor1.jpg", "flor2rosas.jpg", "ramolopso.jpg", "rosasflor3.jpg"]
                    },
                    { 
                        n: "Margaritas", 
                        folder: "margaritas", 
                        pUnidad: 1800, 
                        cantidades: [1, 7, 12],
                        images: ["flor1.jpg", "flor2rosas.jpg", "ramolopso.jpg", "rosasflor3.jpg"]
                    },
                    { 
                        n: "Tulipán", 
                        folder: "tulipan", 
                        pUnidad: 2000, 
                        cantidades: [1, 7, 12],
                        images: ["flor1.jpg", "flor2rosas.jpg", "ramolopso.jpg", "rosasflor3.jpg"]
                    },
                    { 
                        n: "Mariposas", 
                        folder: "mariposas", 
                        pUnidad: 1500, 
                        cantidades: [1, 7, 12],
                        images: ["flor1.jpg", "flor2rosas.jpg", "ramolopso.jpg", "rosasflor3.jpg"]
                    },
                    { 
                        n: "Ramos Personalizados", 
                        folder: "ramos personalizados", 
                        pUnidad: 0, 
                        cantidades: [1],
                        images: ["flor1.jpg", "flor2rosas.jpg", "ramolopso.jpg", "rosasflor3.jpg"]
                    }
                ],
                colores: [
                    {n: 'Rosa', c: '#ffb3d9'}, {n: 'Amarillo', c: '#ffeb3b'}, 
                    {n: 'Rojo', c: '#ff4d4d'}, {n: 'Lila', c: '#d1b3ff'}
                ]
            },
            peluches: { 
                items: [
                    {n: "Kuromi", img: "img/regaleria/peluches/peluche1kuromy.jpg", pUnidad: 6500, cantidades: [1, 2]}
                ],
                colores: [{n: 'Único', c: '#eee'}]
            },
            cajas: { 
                items: [{n: "Caja Especial", img: "img/regaleria/cajas/caja1.jpg", pUnidad: 4000, cantidades: [1]}],
                colores: [{n: 'Rosa', c: '#ffb3d9'}, {n: 'Blanca', c: '#fff'}]
            }
        };

        let catSel = "", modSel = "", colSel = "", cantSel = 1;

        function mostrarProductos(cat) {
            catSel = cat; 
            volver('pantalla-productos');
            document.getElementById('titulo-categoria').innerText = cat.charAt(0).toUpperCase() + cat.slice(1);
            const g = document.getElementById('grid-productos'); 
            g.innerHTML = "";
            
            db[cat].items.forEach(item => {
                let imgPortada = item.img;
                if (cat === 'flores') {
                    const primerImagen = item.images ? item.images[0] : "flor1.jpg";
                    if (item.isRosas) {
                        imgPortada = `img/regaleria/flores/rosasde7/${primerImagen}`;
                    } else {
                        imgPortada = `img/regaleria/flores/${item.folder}/${primerImagen}`;
                    }
                }
                
                g.innerHTML += `
                    <div class="card" onclick="irAConfig('${item.n}', '${imgPortada}')">
                        <img src="${imgPortada}">
                        <span>${item.n}</span>
                    </div>`;
            });
        }

        function irAConfig(nombre, img) {
            modSel = nombre; 
            volver('configurador');
            document.getElementById('final-titulo').innerText = nombre;
            
            const productoActual = db[catSel].items.find(item => item.n === modSel);
            cantSel = productoActual.cantidades[0];

            const p = document.getElementById('picker-colores');
            p.innerHTML = "";
            db[catSel].colores.forEach((color, i) => {
                const div = document.createElement('div');
                div.className = 'color-circle' + (i === 0 ? ' selected' : '');
                div.style.background = color.c;
                div.onclick = () => {
                    document.querySelectorAll('.color-circle').forEach(c => c.classList.remove('selected'));
                    div.classList.add('selected');
                    colSel = color.n;
                    document.getElementById('txt-color').innerText = color.n;
                    actualizarImagenYPrecio(); 
                };
                p.appendChild(div);
                if(i === 0) colSel = color.n;
            });
            document.getElementById('txt-color').innerText = colSel;

            const contenedorCant = document.getElementById('contenedor-botones-cant');
            contenedorCant.innerHTML = "";
            productoActual.cantidades.forEach((cantidad, i) => {
                const btn = document.createElement('button');
                btn.className = 'qty-btn' + (i === 0 ? ' selected' : '');
                btn.innerText = cantidad;
                btn.onclick = () => {
                    document.querySelectorAll('.qty-btn').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    cantSel = cantidad;
                    actualizarImagenYPrecio();
                };
                contenedorCant.appendChild(btn);
            });

            actualizarImagenYPrecio();
        }

        function actualizarImagenYPrecio() {
            const productoActual = db[catSel].items.find(item => item.n === modSel);
            let total = 0;

            if (productoActual) {
                if (catSel === 'flores') {
                    let rutaCarpeta = "";

                    if (productoActual.isRosas) {
                        rutaCarpeta = productoActual.folders[cantSel] || "individuales";
                        total = productoActual.preciosPorCantidad[cantSel] || 0;
                    } else {
                        rutaCarpeta = productoActual.folder;
                        total = productoActual.pUnidad * cantSel;
                    }

                    const nombreImagen = productoActual.images ? productoActual.images[0] : "flor1.jpg";
                    document.getElementById('final-img').src = `img/regaleria/flores/${rutaCarpeta}/${nombreImagen}`;

                } else {
                    document.getElementById('final-img').src = productoActual.img;
                    total = productoActual.pUnidad * cantSel;
                }
            }

            document.getElementById('display-total').innerText = "$" + total.toLocaleString();
        }

        function volver(id) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function mandarPedido() {
            const nota = document.getElementById('nota').value;
            const msg = `¡Hola Puky! 🐾\nQuiero pedir: ${cantSel}x ${modSel}\nColor: ${colSel}\nNota: ${nota}\nTotal: ${document.getElementById('display-total').innerText}`;
            window.open(`https://wa.me/5492646289600?text=${encodeURIComponent(msg)}`);
        }
    </script>
</body>
</html>
